name: Feature request
description: Propose a change to TradePulse Pay.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution. Money-moving changes must say who
        approves the movement and which PayPal call performs it.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck, on which screen, and what they cannot do today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest change that solves the problem.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Pay applications and review
        - Payments (authorize, capture, payout)
        - Retainage
        - Change orders and owner invoices
        - Procurement (packages, bids, leveling)
        - Documents and file download
        - Sign-in and access
        - Dashboard and reports
        - Developer tooling and tests
        - Other
    validations:
      required: true

  - type: dropdown
    id: money
    attributes:
      label: Does this change move money or access?
      options:
        - "No: read-only or presentation"
        - "Yes: money movement (GC approval path required)"
        - "Yes: roles, tenancy or sign-in"
        - Not sure
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
